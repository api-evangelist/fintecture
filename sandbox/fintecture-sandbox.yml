description: Sandbox environment configured per application in the Fintecture Console; payer flows are completed against Demo Bank (Fintecture's mock bank, outcome chosen in the bank UI) or real bank sandboxes (e.g. Credit Mutuel, CIC). Acquiring-account fund arrival is simulated with the Event Simulator; sandbox-only endpoints simulate bank transitions and transactions, and test accounts per bank are listed by API.
docs: https://doc.fintecture.com/docs/testing-complete-payment-flows-in-sandbox
