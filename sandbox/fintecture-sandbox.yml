  docs: https://doc.fintecture.com/docs/demo-bank
- name: Event Simulator
  docs: https://doc.fintecture.com/docs/event-simulator
- name: Simulate a bank transition event (sandbox only, session must be payment_pending)
  docs: https://doc.fintecture.com/reference/simulatepaymentbanktransition
- name: Simulate a transaction
  docs: https://doc.fintecture.com/reference/simulatetransactionevent
- name: Get all test accounts
  docs: https://doc.fintecture.com/reference/getresv1testaccounts
