    type: Documentation
  - url: https://doc.fintecture.com/docs/api-request-an-ais-token
    type: Documentation
  - url: openapi/fintecture-oauth-api-openapi.yml
    type: OpenAPI
  description: >-
    Issues access tokens via authorization_code and client_credentials grants. Distinct scopes for PIS,
    AIS, Customers, E-Mandates, and OAC (Organisation Access Credentials, beta). Access tokens are valid
    for 1 hour and can be refreshed.
