apis:
- aid: fintecture:fintecture-customers-api
  name: Fintecture Customers API
  tags:
  - Customers
  - KYC
  - Bank Accounts
  - Verification
  humanURL: https://doc.fintecture.com/reference/createcustomer
  properties:
  - url: https://doc.fintecture.com/reference/createcustomer
    type: Documentation
  - url: https://doc.fintecture.com/docs/api-verify-a-customer
    type: Documentation
  - url: openapi/fintecture-customers-api-openapi.yml
    type: OpenAPI
  description: >-
    Register and manage merchant customers, attach their bank accounts, and run identity verifications.
    Persisted customer records pre-fill payment fields and accelerate repeat checkouts; verifications
    confirm account holder identity through the AIS rails.
